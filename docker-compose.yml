name: al-hail-demo

services:
  db:
    image: postgres:16-alpine
    container_name: alhail-demo-db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demos
    ports:
      - "5433:5432"
    volumes:
      - alhail-demo-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  alhail-demo-pg:
